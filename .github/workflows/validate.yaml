name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [yaml, build, schema, secrets, age, shell, pluto]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install yq
        if: matrix.check == 'secrets' || matrix.check == 'schema'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          mkdir -p "$HOME/bin"
          wget -qO "$HOME/bin/yq" https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x "$HOME/bin/yq"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install kubeconform
        if: matrix.check == 'schema'
        run: |
          mkdir -p "$HOME/bin"
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.0/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          tar -xz -C "$HOME/bin" -f /tmp/kubeconform.tar.gz
          chmod +x "$HOME/bin/kubeconform"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install pluto
        if: matrix.check == 'pluto'
        run: |
          mkdir -p "$HOME/bin"
          curl -sL https://github.com/fairwindsops/pluto/releases/download/v5.11.0/pluto_5.11.0_linux_amd64.tar.gz -o /tmp/pluto.tar.gz
          tar -xz -C "$HOME/bin" -f /tmp/pluto.tar.gz
          chmod +x "$HOME/bin/pluto"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck
        if: matrix.check == 'shell'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Install yamllint
        if: matrix.check == 'yaml'
        run: |
          pip install yamllint==1.31.0

      - name: Run check
        run: ./scripts/validate.sh ${{ matrix.check }}
