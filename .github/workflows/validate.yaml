name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [yaml, build, schema, secrets, age, shell, pluto]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Install yq
        if: matrix.check == 'secrets' || matrix.check == 'schema'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Install kubeconform
        if: matrix.check == 'schema'
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.0/kubeconform-linux-amd64.tar.gz | tar -xz -C /usr/local/bin

      - name: Install pluto
        if: matrix.check == 'pluto'
        run: |
          curl -sL https://github.com/fairwindsops/pluto/releases/download/v5.11.0/pluto_5.11.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin

      - name: Install shellcheck
        if: matrix.check == 'shell'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run check
        run: ./scripts/validate.sh ${{ matrix.check }}
