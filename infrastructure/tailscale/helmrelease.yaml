apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m

  chart:
    spec:
      chart: tailscale-operator
      version: "1.80.0"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 12h

  values:
    operatorConfig:
      createNamespace: false
