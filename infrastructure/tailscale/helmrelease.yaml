apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 30m

  chart:
    spec:
      chart: tailscale-operator
      version: "1.80.0"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 12h

  values:
    operator:
      enabled: true
      createNamespace: false

    connector:
      enabled: true
      kind: Deployment
      replicas: 1
      hostNetwork: true

    auth:
      secret: tailscale-auth
      key: TS_AUTHKEY
