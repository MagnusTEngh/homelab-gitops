apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m

  chart:
    spec:
      chart: cilium
      version: "1.20.1"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h

  values:

    gatewayAPI:
      enabled: true
      hostNetwork:
        enabled: true

    # Enable BGP for Tailscale integration
    bgp:
      enabled: false

    # Enable LoadBalancer services for Gateway API
    loadBalancer:
      acceleration: native
      mode: snat

    # Enable NodePort range for Tailscale access
    nodePort:
      enabled: true
      auto: true

    ipam:
      mode: kubernetes

    kubeProxyReplacement: true

    # Talos KubePrism
    k8sServiceHost: localhost
    k8sServicePort: 7445

    # Talos already provides cgroupv2
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Required capabilities for Talos
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # Optional
    hubble:
      enabled: false

    operator:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    hostFirewall:
      enabled: false

    encryption:
      enabled: false

    k8sClientRateLimit:
      qps: 10
      burst: 20
