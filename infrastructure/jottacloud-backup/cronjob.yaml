apiVersion: batch/v1
kind: CronJob
metadata:
  name: jottacloud-backup
  namespace: jottacloud-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rclone
              image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              args:
                - "sync"
                - "/data"
                - "jottacloud:homelab-backup"
                - "--config=/config/rclone.conf"
                - "--log-level=INFO"
              volumeMounts:
                - name: rclone-config
                  mountPath: /config
                  readOnly: true
                - name: data
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: rclone-config
              secret:
                secretName: rclone-config
            - name: data
              hostPath:
                path: /var/mnt/local-path-provisioner
                type: Directory
