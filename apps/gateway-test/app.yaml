apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: gateway-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
          args:
            - "-text=hello from gateway api"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: gateway-test
spec:
  selector:
    app: echo
  ports:
    - port: 8080
      targetPort: 5678
---
# Gateway that will be exposed via Tailscale
# Cilium will create a LoadBalancer Service with an IP from the default pool (192.168.1.240/29)
# L2 announcements will make this IP reachable on the LAN
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-test-gateway
  namespace: gateway-test
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-route
  namespace: gateway-test
spec:
  parentRefs:
    - name: gateway-test-gateway
      namespace: gateway-test
  hostnames:
    - "echo.gateway-test"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo
          port: 8080
