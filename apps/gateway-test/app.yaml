apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: gateway-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
          args:
            - "-text=hello from gateway api"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: gateway-test
spec:
  selector:
    app: echo
  ports:
    - port: 8080
      targetPort: 5678
